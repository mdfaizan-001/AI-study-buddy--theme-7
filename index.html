<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Study Focus Pro MAX</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

  <!-- SIDEBAR -->
  <div class="sidebar">
    <h2> Subjects</h2>
    <button onclick="selectSubject('Maths')">Maths</button>
    <button onclick="selectSubject('Science')">Science</button>
    <button onclick="selectSubject('English')">English</button>
    <button onclick="selectSubject('Hindi')">Hindi</button>
    <button onclick="selectSubject('SST')">SST</button>
    <button onclick="selectSubject('Computer')">Computer</button>
    <button onclick="showSchedule()"> Schedule</button>
  </div>

  <!-- MAIN -->
  <div class="main">

    <!-- HERO -->
    <div class="hero">
      <h1> Study Focus Pro MAX</h1>
      <input type="text" id="username" placeholder="Enter your name">
      <button onclick="saveName()">Start</button>
      <h2 id="welcome"></h2>
    </div>

    <!-- DASHBOARD -->
    <div class="dashboard">
      <div class="stat-card">
        <h3>Completed</h3>
        <p id="completedCount">0</p>
      </div>

      <div class="stat-card">
        <h3>Skill</h3>
        <p id="skillScore">0%</p>
      </div>
    </div>

    <h2 id="selectedSubject">Select Subject</h2>

    <div id="chapters"></div>

    <!-- TIMER -->
    <div class="card">
      <h2> Timer</h2>
      <h1 id="timer">00:00</h1>
      <button onclick="startTimer()">Start</button>
      <button onclick="pauseTimer()">Pause</button>
      <button onclick="resetTimer()">Reset</button>
    </div>

  </div>
</div>

<script src="script.js"></script>
</body>
</html>
